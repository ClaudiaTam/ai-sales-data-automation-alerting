name: Execute Sales Automation Pipeline

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  schedule:
    - cron: '0 9 * * *' # Runs automatically every day at 9 AM

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-with-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas pandas-gbq google-cloud-bigquery database-modules fastapi uvicorn

      - name: Run Pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # Recreate the credentials file dynamically in the runner
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp_key.json
          python src/main.py

      - name: Send Success Payload to n8n
        if: success()
        run: |
          # Read the overall metrics row to send directly to n8n
          python -c "
          import pandas as pd, requests, json
          df = pd.read_csv('data/processed/metrics_summary_overall.csv')
          row = df.iloc[0].to_dict()
          payload = {'status': 'success', 'metrics': row}
          requests.post('${{ secrets.N8N_WEBHOOK_URL }}', json=payload)
          "

      - name: Send Failure Payload to n8n
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"status": "failed", "message": "GitHub Actions workflow run failed."}' \
            ${{ secrets.N8N_WEBHOOK_URL }}
